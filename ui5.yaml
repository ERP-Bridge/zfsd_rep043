# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"

metadata:
  name: zo2c_rep043

type: application

server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true

        backend:
          # - path: /sap
          #   url: http://sseci.sap.eu.sodexonet.com:21
          #   destination: SSE_100_Client
          #   client: "100"


          - path: /sap
            destination: DSE_110_Client
            client: "110"

        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com

    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300

    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon

builder:
  resources:
    excludes:
      - /test/**
      - /localService/**